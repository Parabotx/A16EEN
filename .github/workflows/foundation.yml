name: A16EEN Foundation Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-syntax:
    name: Shell syntax and foundation invariants
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          bash -n scripts/install.sh
          bash -n scripts/start-a16een
          bash -n scripts/a16een-shell
          bash -n scripts/a16een-update
          bash -n scripts/a16een-doctor
          bash -n scripts/a16een
          bash -n scripts/a16een-wallpaper
          bash -n scripts/a16een-icons

      - name: Validate foundation files
        run: |
          set -euo pipefail

          test -f niri/config.kdl
          test -f quickshell/a16een/shell.qml
          test -f quickshell/a16een/ui/Launcher.qml
          test -f quickshell/a16een/ui/Dock.qml
          test -f quickshell/a16een/ui/Dashboard.qml
          test -f quickshell/a16een/ui/NotificationToast.qml
          test -f quickshell/a16een/assets/wallpapers/default.png
          test -f quickshell/a16een/assets/icons/search.svg
          test -f quickshell/a16een/assets/icons/terminal.svg
          test -f quickshell/a16een/assets/icons/globe.svg
          test -f quickshell/a16een/assets/icons/folder.svg
          test -f quickshell/a16een/assets/icons/code.svg
          test -f quickshell/a16een/assets/icons/house.svg
          test -f quickshell/a16een/assets/icons/messages-square.svg
          test -f quickshell/a16een/assets/icons/sparkles.svg
          test -f quickshell/a16een/assets/icons/music.svg
          test -f xdg/xdg-desktop-portal/a16een-portals.conf
          test -f scripts/a16een
          test -f scripts/a16een-wallpaper
          test -f docs/RESOURCES.md
          test -f quickshell/a16een/assets/user-images/README.md

          grep -Fq 'spawn-sh-at-startup "a16een-shell"' niri/config.kdl
          grep -Fq 'workspace "home"' niri/config.kdl
          grep -Fq 'workspace "code"' niri/config.kdl
          grep -Fq 'workspace "web"' niri/config.kdl
          grep -Fq 'workspace "comms"' niri/config.kdl
          grep -Fq 'workspace "studio"' niri/config.kdl
          grep -Fq 'workspace "music"' niri/config.kdl
          grep -Fq 'import qs.ui' quickshell/a16een/shell.qml
          grep -Fq 'Super+Space repeat=false hotkey-overlay-title="A16EEN Application Launcher"' niri/config.kdl
          grep -Fq 'ToplevelManager.activeToplevel' quickshell/a16een/shell.qml
          ! grep -Fq 'focusedWindowProcess' quickshell/a16een/shell.qml
          ! grep -Fq 'is_fullscreen' quickshell/a16een/shell.qml
          grep -Fq 'x: root.dockVisible' quickshell/a16een/ui/Dock.qml
          grep -Fq 'verticalAlignment: Text.AlignVCenter' quickshell/a16een/ui/Launcher.qml
          ! grep -q 'Mod+A .*launcher toggle' niri/config.kdl
          grep -Fq 'focusedWindowFullscreen' quickshell/a16een/shell.qml
          grep -Fq 'fullscreenActive: root.focusedWindowFullscreen' quickshell/a16een/shell.qml
          grep -Fq 'property bool edgeRevealed' quickshell/a16een/ui/Dock.qml
          grep -Fq 'width: 8' quickshell/a16een/ui/Dock.qml
          grep -Fq 'height: 240' quickshell/a16een/ui/Dock.qml
          grep -Fq 'x: root.dockVisible' quickshell/a16een/ui/Dock.qml
          grep -Fq 'Mod+X repeat=false { close-window; }' niri/config.kdl
          grep -Fq 'Mod+F { fullscreen-window; }' niri/config.kdl
          grep -Fq 'Mod+T repeat=false { spawn-sh "qs -c \"$HOME/.config/a16een/quickshell/a16een\" ipc call fullscreen exit"; }' niri/config.kdl
          ! grep -q 'Mod+Slash.*launcher toggle' niri/config.kdl
          ! grep -Fq 'Mod+F { maximize-column; }' niri/config.kdl
          grep -Fq 'Mod+M { maximize-column; }' niri/config.kdl
          grep -Fq 'Dock {' quickshell/a16een/shell.qml
          grep -Fq 'anchors.right: true' quickshell/a16een/ui/Dock.qml
          grep -Fq 'width: 44' quickshell/a16een/ui/Dock.qml
          grep -Fq 'height: 260' quickshell/a16een/ui/Dock.qml
          ! grep -Fq 'D7B56D' quickshell/a16een/ui/Dock.qml
          ! grep -Fq 'Repeater' quickshell/a16een/ui/Dock.qml
          ! grep -Fq '⚙' quickshell/a16een/ui/Dock.qml
          ! grep -Fq 'text: "A"' quickshell/a16een/ui/Dock.qml
          ! grep -Fq 'TopBar {' quickshell/a16een/shell.qml
          grep -Fq 'workspaces: root.workspaces' quickshell/a16een/shell.qml
          grep -Fq 'focusedWorkspaceId: root.focusedWorkspaceId' quickshell/a16een/shell.qml
          grep -Fq 'signal closeRequested' quickshell/a16een/ui/Launcher.qml
          ! grep -Fq 'root.opened = false' quickshell/a16een/ui/Launcher.qml
          grep -Fq 'current.id === root.focusedWorkspaceId' quickshell/a16een/ui/Dock.qml
          grep -Fq 'focusWorkspace(1)' quickshell/a16een/ui/Dock.qml
          grep -Fq 'focusWorkspace(2)' quickshell/a16een/ui/Dock.qml
          grep -Fq 'focusWorkspace(3)' quickshell/a16een/ui/Dock.qml
          grep -Fq 'focusWorkspace(4)' quickshell/a16een/ui/Dock.qml
          grep -Fq 'focusWorkspace(5)' quickshell/a16een/ui/Dock.qml
          grep -Fq 'focusWorkspace(6)' quickshell/a16een/ui/Dock.qml
          ! grep -Fq 'activeBackground' quickshell/a16een/ui/Dock.qml
          grep -Fq 'rightMargin: 66' quickshell/a16een/ui/Launcher.qml
          ! grep -Fq 'text: "Applications"' quickshell/a16een/ui/Dock.qml
          ! grep -Fq 'launcherMouse.containsMouse ? root.hoverBackground' quickshell/a16een/ui/Dock.qml
          grep -Fq 'GridView {' quickshell/a16een/ui/Launcher.qml
          grep -Fq 'cellWidth: 88' quickshell/a16een/ui/Launcher.qml
          grep -Fq 'cellHeight: 72' quickshell/a16een/ui/Launcher.qml
          grep -Fq 'text: appTile.entry.name' quickshell/a16een/ui/Launcher.qml
          ! grep -Fq 'QUICK LAUNCH' quickshell/a16een/ui/Launcher.qml
          grep -Fq 'width: 500' quickshell/a16een/ui/Launcher.qml
          grep -Fq 'height: 380' quickshell/a16een/ui/Launcher.qml
          grep -Fq 'text: appTile.entry.name' quickshell/a16een/ui/Launcher.qml
          grep -Fq 'acceptedButtons: Qt.NoButton' quickshell/a16een/ui/Launcher.qml
          grep -Fq 'TextInput {' quickshell/a16een/ui/Launcher.qml
          grep -Fq 'Quickshell.iconPath' quickshell/a16een/ui/Launcher.qml
          ! grep -Fq 'QUICK LAUNCH' quickshell/a16een/ui/Launcher.qml
          ! grep -Fq 'appGrid.columns' quickshell/a16een/ui/Launcher.qml
          ! grep -Fq 'search.svg' quickshell/a16een/ui/Launcher.qml
          grep -Fq 'Layout.preferredWidth: 300' quickshell/a16een/ui/Launcher.qml
          grep -Fq 'height: 36' quickshell/a16een/ui/Launcher.qml
          grep -Fq 'xwayland-satellite' niri/config.kdl
          grep -Fq 'Mod+Return { spawn "foot"; }' niri/config.kdl
          grep -Fq 'XF86AudioPlay allow-when-locked=true { spawn "playerctl" "play-pause"; }' niri/config.kdl
          grep -Fq 'XF86AudioMute allow-when-locked=true {' niri/config.kdl
          grep -Fq 'spawn "wpctl" "set-mute" "@DEFAULT_AUDIO_SINK@" "toggle";' niri/config.kdl
          grep -Fq 'xdg-desktop-portal' scripts/install.sh
          grep -Fq 'bash "$ROOT_DIR/scripts/a16een-icons"' scripts/install.sh
          grep -Fq 'niri msg action load-config-file' scripts/install.sh
          grep -Fq 'a16een-shell' scripts/install.sh
          grep -Fq 'inter-font' scripts/install.sh
          grep -Fq 'ttf-lato' scripts/install.sh
          grep -Fq 'adobe-source-sans-fonts' scripts/install.sh
          grep -Fq 'ttf-roboto' scripts/install.sh
          grep -Fq 'ttf-roboto-mono' scripts/install.sh
          grep -Fq 'USER_WALLPAPER_DIR' scripts/install.sh
          grep -Fq 'a16een-wallpaper' scripts/install.sh
          grep -Fq 'wallpaper)' scripts/a16een
          grep -Fq 'a16een-update --rollback' README.md
          grep -Fq 'NIRI_CONFIG' scripts/start-a16een
          # Launcher shortcut is already validated earlier in this block.

      - name: Validate no legacy wallpaper reference
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git 'default\.webp' .; then
            echo "Legacy default.webp reference found." >&2
            exit 1
          fi

