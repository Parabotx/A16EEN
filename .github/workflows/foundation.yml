name: A16EEN Foundation Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-syntax:
    name: Shell syntax and foundation invariants
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          bash -n scripts/install.sh
          bash -n scripts/start-a16een
          bash -n scripts/a16een-shell
          bash -n scripts/a16een-update
          bash -n scripts/a16een-doctor
          bash -n scripts/a16een
          bash -n scripts/a16een-icons

      - name: Validate foundation files
        run: |
          set -euo pipefail

          test -f niri/config.kdl
          test -f quickshell/a16een/shell.qml
          test -f quickshell/a16een/ui/Launcher.qml
          test -f quickshell/a16een/ui/Dock.qml
          test -f quickshell/a16een/ui/Dashboard.qml
          test -f quickshell/a16een/ui/NotificationToast.qml
          test -f quickshell/a16een/assets/wallpapers/default.png
          test -f quickshell/a16een/assets/icons/search.svg
          test -f quickshell/a16een/assets/icons/terminal.svg
          test -f quickshell/a16een/assets/icons/globe.svg
          test -f quickshell/a16een/assets/icons/folder.svg
          test -f quickshell/a16een/assets/icons/code-2.svg
          test -f xdg/xdg-desktop-portal/a16een-portals.conf
          test -f scripts/a16een

          grep -q 'spawn-sh-at-startup "a16een-shell"' niri/config.kdl
          grep -q 'import "ui" as A16UI' quickshell/a16een/shell.qml
          grep -q 'Mod+Space repeat=false { spawn-sh "qs ipc call launcher toggle"; }' niri/config.kdl
          grep -q 'A16UI.Dock {' quickshell/a16een/shell.qml
          ! grep -q 'TopBar {' quickshell/a16een/shell.qml
          grep -q 'xwayland-satellite' niri/config.kdl
          grep -q 'Mod+Return { spawn "foot"; }' niri/config.kdl
          grep -q 'XF86AudioPlay allow-when-locked=true { spawn "playerctl" "play-pause"; }' niri/config.kdl
          grep -q 'XF86AudioMute allow-when-locked=true {' niri/config.kdl
          grep -q 'spawn "wpctl" "set-mute" "@DEFAULT_AUDIO_SINK@" "toggle";' niri/config.kdl
          grep -q 'xdg-desktop-portal' scripts/install.sh
          grep -q 'a16een-shell' scripts/install.sh
          grep -q 'a16een-update --rollback' README.md
          grep -q 'NIRI_CONFIG' scripts/start-a16een
          ! grep -q 'export XDG_CONFIG_HOME=' scripts/start-a16een
          grep -q "a16een logout" README.md
          grep -q "a16een reboot" README.md
          grep -q "a16een volume up" README.md
          grep -q "a16een icons" README.md

      - name: Validate no legacy wallpaper reference
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git 'default\.webp' .; then
            echo "Legacy default.webp reference found." >&2
            exit 1
          fi
