name: A16EEN Foundation Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-syntax:
    name: Shell syntax and foundation invariants
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check QML syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools
          export PATH="/usr/lib/qt6/bin:$PATH"
          qmlformat quickshell/a16een/shell.qml >/dev/null
          qmlformat quickshell/a16een/ui/ToolsPanel.qml >/dev/null
          qmlformat quickshell/a16een/ui/CalculatorPanel.qml >/dev/null
          qmlformat quickshell/a16een/ui/DataMeterIndicator.qml >/dev/null

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          trap 'status=$?; echo "Shell check failed at line ${LINENO}: ${BASH_COMMAND} (exit ${status})" >&2; exit "${status}"' ERR
          bash -n scripts/install.sh
          bash -n scripts/start-a16een
          bash -n scripts/a16een-shell
          bash -n scripts/a16een-update
          bash -n scripts/a16een-doctor
          bash -n scripts/a16een
          bash -n scripts/a16een-wallpaper
          bash -n scripts/a16een-icons
          bash -n scripts/a16een-screenshot
          bash -n scripts/a16een-control
          python3 -m py_compile scripts/a16een-clipboard scripts/a16een-app-stash scripts/a16een-system-monitor scripts/a16een-data-meter
          python3 tests/test_app_stash.py
          python3 tests/test_system_monitor.py
          python3 tests/test_data_meter.py
          bash -n scripts/a16een-icon-theme
          bash -n scripts/a16een-workspace-preset
          python3 -m py_compile scripts/a16een-music scripts/a16een-widget-settings
          grep -Fq 'a16een-workspace-preset' scripts/install.sh
          grep -Fq 'a16een-clipboard' scripts/install.sh
          grep -Fq 'a16een-app-stash' scripts/install.sh
          grep -Fq 'workspace "app-stash"' niri/config.kdl
          grep -Fq 'Super+H repeat=false hotkey-overlay-title="A16EEN Hide Window to Nest"' niri/config.kdl
          grep -Fq 'Super+Ctrl+H repeat=false hotkey-overlay-title="A16EEN Nest"' niri/config.kdl
          grep -Fq 'target: "app-stash"' quickshell/a16een/shell.qml
          ! grep -Fq 'CalculatorPanel {' quickshell/a16een/shell.qml
          grep -Fq 'clipboardHistoryWatcher' quickshell/a16een/shell.qml
          grep -Fq 'notification-history.json' quickshell/a16een/shell.qml
          grep -Fq 'function rememberNotification(notification)' quickshell/a16een/shell.qml
          grep -Fq 'QuickHubTray {' quickshell/a16een/shell.qml
          grep -Fq 'NotificationCenter {' quickshell/a16een/shell.qml
          grep -Fq 'ToolsPanel {' quickshell/a16een/shell.qml
          grep -Fq 'id: "notifications", icon: "lucide-bell.svg"' quickshell/a16een/ui/QuickHubTray.qml
          grep -Fq 'id: "tools", icon: "lucide-toolbox.svg"' quickshell/a16een/ui/QuickHubTray.qml
          test "$(grep -c 'sourceSize.width: 64' quickshell/a16een/ui/QuickHubTray.qml)" -eq 2
          grep -Fq 'signal toolRequested(string toolId)' quickshell/a16een/ui/ToolsPanel.qml
          grep -Fq 'label: "System Monitor"' quickshell/a16een/ui/ToolsPanel.qml
          grep -Fq 'label: "Data Meter"' quickshell/a16een/ui/ToolsPanel.qml
          grep -Fq 'DataMeterIndicator {' quickshell/a16een/shell.qml
          grep -Fq 'data-meter-settings.json' quickshell/a16een/shell.qml
          grep -Fq 'dataMeterBootstrapTimer' quickshell/a16een/shell.qml
          grep -Fq 'function openToolsPage(pageName)' quickshell/a16een/shell.qml
          grep -Fq 'a16een-data-meter' scripts/install.sh
          grep -Fq 'id: "stash", label: "Nest"' quickshell/a16een/ui/ToolsPanel.qml
          ! grep -Fq 'label: "Clipboard"' quickshell/a16een/ui/ToolsPanel.qml
          ! grep -Fq 'label: "Wallpapers"' quickshell/a16een/ui/ToolsPanel.qml
          grep -Fq 'dataMeterToggleRequested(bool enabled)' quickshell/a16een/ui/ToolsPanel.qml
          grep -Fq 'Flow.LeftToRight' quickshell/a16een/ui/ToolsPanel.qml
          grep -Fq 'a16een-system-monitor' quickshell/a16een/ui/ToolsPanel.qml
          grep -Fq 'running: root.opened && root.page === "monitor"' quickshell/a16een/ui/ToolsPanel.qml
          ! grep -Fq 'App Stash' quickshell/a16een/ui/ToolsPanel.qml
          grep -Fq 'lucide-toolbox.svg' quickshell/a16een/ui/ToolsPanel.qml
          grep -Fq 'id: monitorPage' quickshell/a16een/ui/ToolsPanel.qml
          ! grep -Fq 'Behavior on opacity' quickshell/a16een/ui/CalculatorPanel.qml
          grep -Fq "You're all caught up" quickshell/a16een/ui/NotificationCenter.qml
          grep -Fq 'implicitWidth: 322' quickshell/a16een/ui/NotificationToast.qml
          grep -Fq 'root.modeRequested(tabButton.modelData.id)' quickshell/a16een/ui/UtilitiesPanel.qml
          grep -Fq '{ id: "clipboard", label: "Clipboard", icon: "clipboard" }' quickshell/a16een/ui/UtilitiesPanel.qml
          grep -Fq 'width: (modeTabs.width - modeTabs.spacing * 2) / 3' quickshell/a16een/ui/UtilitiesPanel.qml
          grep -Fq 'Copied to clipboard' quickshell/a16een/ui/UtilitiesPanel.qml
          grep -Fq 'clipboardPendingAction === "copy"' quickshell/a16een/ui/UtilitiesPanel.qml
          ! grep -Fq 'id: clipboardButton' quickshell/a16een/ui/UtilitiesPanel.qml
          grep -Fq 'import Quickshell.Io' quickshell/a16een/ui/UtilitiesPanel.qml
          ! grep -Fq 'placeholderText:' quickshell/a16een/ui/UtilitiesPanel.qml
          grep -Fq '"--type",' scripts/a16een-clipboard
          grep -Fq 'popupHeight: root.selectedMode === "clipboard" ? 410 : 340' quickshell/a16een/ui/UtilitiesPanel.qml
          grep -Fq 'RETENTION_SECONDS = 24 * 60 * 60' scripts/a16een-clipboard
          grep -Fq '"--watch"' scripts/a16een-clipboard
          grep -Fq 'clipboard-history.json' scripts/a16een-clipboard

          CLIPBOARD_TEST_HOME="$(mktemp -d)"
          printf 'sample clipboard text\n' | XDG_STATE_HOME="$CLIPBOARD_TEST_HOME" python3 scripts/a16een-clipboard capture
          printf 'sample clipboard text\n' | XDG_STATE_HOME="$CLIPBOARD_TEST_HOME" python3 scripts/a16een-clipboard capture
          XDG_STATE_HOME="$CLIPBOARD_TEST_HOME" python3 scripts/a16een-clipboard list | python3 -c 'import json,sys; items=json.load(sys.stdin); assert len(items)==1 and items[0]["content"].startswith("sample clipboard text")'
          XDG_STATE_HOME="$CLIPBOARD_TEST_HOME" python3 -c 'import json,os,pathlib,time; p=pathlib.Path(os.environ["XDG_STATE_HOME"])/"a16een"/"clipboard-history.json"; d=json.loads(p.read_text()); d[0]["timestamp"]=int(time.time()*1000)-25*60*60*1000; p.write_text(json.dumps(d))'
          XDG_STATE_HOME="$CLIPBOARD_TEST_HOME" python3 scripts/a16een-clipboard list | python3 -c 'import json,sys; assert json.load(sys.stdin)==[]'
          rm -rf "$CLIPBOARD_TEST_HOME"
          grep -Fq 'cp "$ROOT_DIR/quickshell/a16een/ui/"*.qml "$TMP_DEPLOY/ui/"' scripts/install.sh
          grep -Fq 'workspace presets' quickshell/a16een/ui/CommandCenter.qml
          grep -Fq 'id: "presets"' quickshell/a16een/ui/CommandCenter.qml
          grep -Fq 'WorkspacePresetsSection {' quickshell/a16een/ui/CommandCenter.qml
          grep -Fq 'target: "workspace-presets"' quickshell/a16een/shell.qml
          grep -Fq 'qs ipc call workspace-presets open' scripts/a16een
          grep -Fq 'DesktopEntries.applications.values' quickshell/a16een/ui/WorkspacePresetsSection.qml
          grep -Fq 'CHOOSE APPLICATION' quickshell/a16een/ui/WorkspacePresetsSection.qml
          grep -Fq 'CHOOSE WORKSPACE' quickshell/a16een/ui/WorkspacePresetsSection.qml
          grep -Fq 'a16een-workspace-preset", "open"' quickshell/a16een/ui/WorkspacePresetsSection.qml
          grep -Fq 'MoveWindowToWorkspace' scripts/a16een-workspace-preset
          grep -Fq 'focus-workspace' scripts/a16een-workspace-preset
          ! grep -Fq 'papirus-icon-theme' scripts/install.sh
          ! grep -Fq 'breeze-icons' scripts/install.sh
          ! grep -Fq 'elementary-icon-theme' scripts/install.sh
          ! grep -Fq 'tela-circle-icon-theme-standard' scripts/install.sh
          ! grep -Fq 'tela-circle-icon-theme-blue' scripts/install.sh
          ! grep -Fq 'tela-circle-icon-theme-dracula' scripts/install.sh
          grep -Fq 'split("\n")' quickshell/a16een/ui/ControlDetailSection.qml
          grep -Fq 'split("\n")' quickshell/a16een/ui/IconThemeSection.qml
          grep -Fq 'property int iconThemeRevision' quickshell/a16een/ui/Launcher.qml
          grep -Fq 'property string iconThemeName' quickshell/a16een/ui/Launcher.qml
          grep -Fq 'a16een-icon-theme", "resolve"' quickshell/a16een/ui/Launcher.qml
          grep -Fq 'source: root.iconSource(appTile.entry.icon)' quickshell/a16een/ui/Launcher.qml
          grep -Fq 'onIconThemeChanged: root.iconThemeRevision++' quickshell/a16een/shell.qml
          ! grep -Fq 'restart-shell' quickshell/a16een/ui/IconThemeSection.qml
          grep -Fq 'resolve)' scripts/a16een-icon-theme
          grep -Fq 'build_icon_index()' scripts/a16een-icon-theme
          grep -Fq 'system_theme_name()' scripts/a16een-icon-theme
          grep -Fq 'CACHE_VERSION="v2"' scripts/a16een-icon-theme
          grep -Fq 'Inherits' scripts/a16een-icon-theme
          grep -Fq -- '-type l' scripts/a16een-icon-theme
          grep -Fq 'asynchronous: true' quickshell/a16een/ui/Launcher.qml
          grep -Fq 'mipmap: true' quickshell/a16een/ui/Launcher.qml
          ! grep -Fq 'pacman -Syu --needed "$package"' scripts/a16een-icon-theme
          ! grep -Fq 'pacman -Syu --needed "$package"' scripts/a16een-icon-theme
          grep -Fq 'pacman -S --needed' scripts/a16een-icon-theme
          grep -Fq 'INSTALL' quickshell/a16een/ui/IconThemeSection.qml

      - name: Validate foundation files
        run: |
          set -euo pipefail
          trap 'status=$?; echo "Foundation check failed at line ${LINENO}: ${BASH_COMMAND} (exit ${status})" >&2; exit "$status"' ERR

          test -f niri/config.kdl
          test -f quickshell/a16een/shell.qml
          test -f quickshell/a16een/ui/Launcher.qml
          test -f quickshell/a16een/ui/Dock.qml
          test -f quickshell/a16een/ui/Dashboard.qml
          test -f quickshell/a16een/ui/CommandCenter.qml
          test -f quickshell/a16een/ui/ScreenshotCenter.qml
          test -f quickshell/a16een/ui/ScreenshotSettings.qml
          test -f quickshell/a16een/ui/ScreenshotPreview.qml
          test -f quickshell/a16een/ui/ControlCenterSection.qml
          test -f quickshell/a16een/ui/ControlDetailSection.qml
          test -f quickshell/a16een/ui/UtilitiesPanel.qml
          test -f quickshell/a16een/ui/IconThemeSection.qml
          test -f quickshell/a16een/ui/WorkspacePresetsSection.qml
          grep -Fq 'readonly property bool canSave' quickshell/a16een/ui/WorkspacePresetsSection.qml
          grep -Fq 'id: addMouse' quickshell/a16een/ui/WorkspacePresetsSection.qml
          grep -Fq 'acceptedButtons: Qt.LeftButton' quickshell/a16een/ui/WorkspacePresetsSection.qml
          grep -Fq 'root.editorOpen = true' quickshell/a16een/ui/WorkspacePresetsSection.qml
          grep -Fq 'onClicked: {' quickshell/a16een/ui/WorkspacePresetsSection.qml
          test -f scripts/a16een-screenshot
          test -f scripts/a16een-system-monitor
          test -f scripts/a16een-data-meter
          test -f tests/test_data_meter.py
          test -f tests/test_system_monitor.py
          test -f quickshell/a16een/assets/icons/lucide-toolbox.svg
          test -f quickshell/a16een/assets/icons/lucide-activity.svg
          test -f scripts/a16een-control
          test -f scripts/a16een-icon-theme
          test -f quickshell/a16een/assets/icons/lucide-monitor.svg
          test -f quickshell/a16een/assets/icons/lucide-crop.svg
          test -f quickshell/a16een/assets/icons/lucide-app-window.svg
          test -f quickshell/a16een/assets/icons/lucide-settings.svg
          test -f quickshell/a16een/assets/icons/lucide-folder-open.svg
          test -f quickshell/a16een/assets/icons/lucide-clipboard.svg
          test -f quickshell/a16een/assets/icons/lucide-mouse-pointer.svg
          test -f quickshell/a16een/assets/icons/lucide-wifi.svg
          test -f quickshell/a16een/assets/icons/lucide-bluetooth.svg
          test -f quickshell/a16een/assets/icons/lucide-volume-2.svg
          test -f quickshell/a16een/assets/icons/lucide-sun.svg
          test -f quickshell/a16een/assets/icons/lucide-moon.svg
          test -f quickshell/a16een/assets/icons/lucide-battery.svg
          test -f quickshell/a16een/assets/icons/lucide-bell-off.svg
          test -f quickshell/a16een/assets/icons/lucide-sliders-horizontal.svg
          test -f quickshell/a16een/assets/icons/lucide-arrow-left.svg
          test -f quickshell/a16een/assets/icons/lucide-arrow-left-dark.svg
          test -f quickshell/a16een/assets/icons/lucide-wifi-dark.svg
          test -f quickshell/a16een/assets/icons/lucide-bluetooth-dark.svg
          test -f quickshell/a16een/assets/icons/lucide-volume-2-dark.svg
          test -f quickshell/a16een/assets/icons/lucide-sun-dark.svg
          test -f quickshell/a16een/assets/icons/lucide-moon-dark.svg
          test -f quickshell/a16een/assets/icons/lucide-battery-dark.svg
          test -f quickshell/a16een/assets/icons/lucide-bell-off-dark.svg
          test -f quickshell/a16een/assets/icons/lucide-palette.svg
          test -f quickshell/a16een/ui/WidgetCatalog.js
          test -f quickshell/a16een/ui/MusicWidget.qml
          test -f quickshell/a16een/ui/QuotesWidget.qml
          test -f quickshell/a16een/assets/quotes.json
          test -f quickshell/a16een/assets/icons/quote-mark.svg
          python3 -m json.tool quickshell/a16een/assets/quotes.json >/dev/null
          grep -Fq "anchors.top: parent.top" quickshell/a16een/ui/QuotesWidget.qml
          grep -Fq "anchors.left: parent.left" quickshell/a16een/ui/QuotesWidget.qml
          ! grep -Fq "anchors.right: parent.right" quickshell/a16een/ui/QuotesWidget.qml
          grep -Fq "interval: 60 * 60 * 1000" quickshell/a16een/ui/QuotesWidget.qml
          grep -Fq "mask: Region { item: card }" quickshell/a16een/ui/QuotesWidget.qml
          grep -Fq "Math.floor(Math.random() * root.quotes.length)" quickshell/a16een/ui/QuotesWidget.qml
          grep -Fq "THE WEALTH MINDSET" quickshell/a16een/ui/QuotesWidget.qml
          test "$(python3 -c 'import json; print(len(json.load(open("quickshell/a16een/assets/quotes.json"))["quotes"]))')" -ge 50
          ! grep -Fq "quoteCounter" quickshell/a16een/ui/QuotesWidget.qml
          ! grep -Fq "showNextQuote" quickshell/a16een/ui/QuotesWidget.qml
          ! grep -Fq "QUOTE FOR TODAY" quickshell/a16een/ui/QuotesWidget.qml
          ! grep -Fq "height: 2" quickshell/a16een/ui/QuotesWidget.qml
          grep -Fq 'id: "quotes"' quickshell/a16een/ui/WidgetCatalog.js
          grep -Fq 'quotesWidgetEnabled' quickshell/a16een/shell.qml
          grep -Fq 'quotesWidgetEnabledRequested' quickshell/a16een/ui/CommandCenter.qml
          grep -Fq 'quotesWidgetEnabledRequested' quickshell/a16een/ui/WidgetSection.qml
          grep -Fq 'id: registryScroll' quickshell/a16een/ui/WidgetSection.qml
          grep -Fq 'cp "$ROOT_DIR/quickshell/a16een/assets/quotes.json" "$TMP_DEPLOY/assets/quotes.json"' scripts/install.sh
          test -f quickshell/a16een/ui/MusicDecor.qml
          grep -Fq 'MusicDecor {' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'readonly property real recordSize:' quickshell/a16een/ui/MusicDecor.qml
          grep -Fq 'CD-inspired metallic disc' quickshell/a16een/ui/MusicDecor.qml
          grep -Fq 'id: spinningDisc' quickshell/a16een/ui/MusicDecor.qml
          grep -Fq 'RotationAnimation on rotation' quickshell/a16een/ui/MusicDecor.qml
          grep -Fq 'running: root.playing' quickshell/a16een/ui/MusicDecor.qml
          grep -Fq 'property string coverSource: ""' quickshell/a16een/ui/MusicDecor.qml
          grep -Fq 'readonly property bool hasCover:' quickshell/a16een/ui/MusicDecor.qml
          grep -Fq 'interval: 10000' quickshell/a16een/ui/MusicDecor.qml
          grep -Fq 'root.woodTone ? "#D5BE9A" : "#E5EBF0"' quickshell/a16een/ui/MusicDecor.qml
          grep -Fq 'maskEnabled: true' quickshell/a16een/ui/MusicDecor.qml
          grep -Fq 'source: coverImage' quickshell/a16een/ui/MusicDecor.qml
          grep -Fq 'coverSource: root.currentCover' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'readonly property color cream: "#B8EAF2F8"' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'gradient: Gradient {' quickshell/a16een/ui/MusicDecor.qml
          grep -Fq 'mask: Region {' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'Region { item: card }' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'playing: root.isPlaying' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'MusicDecor {' quickshell/a16een/ui/MusicWidget.qml
          ! grep -Fq 'visualizerProcess' quickshell/a16een/ui/MusicWidget.qml
          ! grep -Fq 'refreshAudioLevel' quickshell/a16een/ui/MusicWidget.qml
          ! grep -Fq 'applyAudioLevelOutput' quickshell/a16een/ui/MusicWidget.qml
          ! grep -Fq 'audioLevel' quickshell/a16een/ui/MusicWidget.qml
          ! grep -Fq 'bandLevels' quickshell/a16een/ui/MusicWidget.qml
          ! grep -Fq 'hardBeat' quickshell/a16een/ui/MusicWidget.qml
          ! grep -Fq 'def visualizer_state()' scripts/a16een-music
          ! grep -Fq 'tone_amplitude(frequency)' scripts/a16een-music
          ! grep -Fq 'action == "visualizer"' scripts/a16een-music
          ! grep -Fq 'import math' scripts/a16een-music
          ! grep -Fq 'import struct' scripts/a16een-music
          ! grep -R -Fq 'Qt.labs.lottieqt' quickshell/a16een/ui
          test -f scripts/a16een-music
          test -f scripts/a16een-widget-settings
          grep -Fq 'id: "music"' quickshell/a16een/ui/WidgetCatalog.js
          grep -Fq 'musicWidgetEnabled' quickshell/a16een/shell.qml
          grep -Fq 'navbarPosition: root.navbarPosition' quickshell/a16een/shell.qml
          grep -Fq 'MusicWidget {' quickshell/a16een/shell.qml
          grep -Fq 'musicWidgetEnabledRequested' quickshell/a16een/ui/CommandCenter.qml
          grep -Fq 'property bool musicEnabled: false' quickshell/a16een/ui/WidgetSection.qml
          grep -Fq 'A16EEN MUSIC' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'iconName: "music-skip-back"' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'iconName: "music-skip-forward"' quickshell/a16een/ui/MusicWidget.qml
          ! grep -Fq 'glyph:' quickshell/a16een/ui/MusicWidget.qml
          test -f quickshell/a16een/assets/icons/music-shuffle.svg
          test -f quickshell/a16een/assets/icons/music-skip-back.svg
          test -f quickshell/a16een/assets/icons/music-skip-forward.svg
          test -f quickshell/a16een/assets/icons/music-play.svg
          test -f quickshell/a16een/assets/icons/music-play-light.svg
          test -f quickshell/a16een/assets/icons/music-pause.svg
          test -f quickshell/a16een/assets/icons/music-pause-light.svg
          test -f quickshell/a16een/assets/icons/music-repeat.svg
          test -f quickshell/a16een/assets/icons/music-list.svg
          test -f quickshell/a16een/assets/icons/music-close.svg
          ! grep -Fq 'remainingTime.implicitWidth' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'id: elapsedTimePill' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'id: totalTimePill' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'anchors.bottom: parent.bottom' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'height: 170' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'id: libraryPopup' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'property string libraryQuery: ""' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'readonly property var filteredTracks:' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'focusable: root.libraryOpen' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'WlrKeyboardFocus.OnDemand' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'id: libraryKeyboardInput' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'root.libraryQuery = ""' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'model: root.filteredTracks' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'root.playTrack(root.indexForPath(modelData.path))' quickshell/a16een/ui/MusicWidget.qml
          ! grep -Fq 'YOUR MUSIC' quickshell/a16een/ui/MusicWidget.qml
          ! grep -Fq ' SONGS' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'readonly property bool libraryPopupOpensRight' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'x: root.libraryPopupOpensRight ? card.x + card.width + 8' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq '? card.y + card.height - height' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq ': Math.max(12, card.y - height - 8)' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'property bool shuffleEnabled: false' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'root.runAction(["repeat", String(normalized)])' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'root.runAction(["repeat", String(root.repeatMode)])' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'action == "repeat"' scripts/a16een-music
          grep -Fq 'loop-file' scripts/a16een-music
          grep -Fq 'eof-reached' scripts/a16een-music
          grep -Fq 'result.eofReached === true' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'repeatIndicatorMode: root.repeatMode' quickshell/a16een/ui/MusicWidget.qml
          grep -Fq 'root.repeatMode === 0 ? 2' quickshell/a16een/ui/MusicWidget.qml
