[main]
# Keep the clock, password card, and security status visible.
idle-hide=false
start-hidden=false

# Detect active MPRIS players and place the compact media card below the clock.
[playerctl]
position=under-clock
art-size=56
show-hidden=false

# Lock-screen power controls. All actions use a small fixed allowlist helper.
[powerbar]
show-labels=true
linked-buttons=false
button-timeout=900
logout-command=/usr/local/bin/a16een-lockscreen-action logout
reboot-command=/usr/local/bin/a16een-lockscreen-action reboot
poweroff-command=/usr/local/bin/a16een-lockscreen-action poweroff
suspend-command=/usr/local/bin/a16een-lockscreen-action suspend
